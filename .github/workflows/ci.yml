name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-static:
    name: Linux static and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Linux test tools
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
      - name: Run Linux tests
        run: bash tests/test_project.sh
      - name: Test persistent desktop home permissions
        run: bash tests/test_desktop_home_permissions.sh
      - name: Test Cloudflare API contract without credentials or network calls
        run: bash tests/test_cloudflare_api_mock.sh
      - name: Render Cloudflare environment with fake API and verify rollback
        run: bash tests/test_cloudflare_generator_smoke.sh

  windows-static:
    name: Windows static and unit tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Windows tests
        shell: powershell
        run: .\tests\TestProject.ps1

  generator-smoke:
    name: Linux generator and Compose smoke test
    needs: linux-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Render an unlimited environment
        run: bash tests/test_generator_smoke.sh

  wireguard-runtime:
    name: WireGuard sidecar runtime test
    needs: linux-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Test the WireGuard transport and proxies
        run: bash tests/test_wireguard_runtime.sh
